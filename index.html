<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BodyQuest · treino em casa gamificado</title>
  <!-- Fontes e ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #0F0F1A;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* container principal – simula o app */
    .app-container {
      max-width: 420px;
      width: 100%;
      background: #1A1A2E;
      border-radius: 44px;
      padding: 20px 18px 28px;
      box-shadow: 0 25px 50px -8px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,255,255,0.06);
      transition: all 0.2s;
    }

    /* CABEÇALHO */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .streak-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2D2D44;
      padding: 8px 14px;
      border-radius: 40px;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.5), 0 4px 0 #0B0B16;
      border: 1px solid rgba(255,200,0,0.3);
    }

    .streak-box i {
      color: #FFB800;
      font-size: 22px;
      filter: drop-shadow(0 0 6px #FFB800);
    }

    .streak-count {
      font-weight: 900;
      font-size: 22px;
      color: #FFD966;
      margin-right: 2px;
    }

    .streak-label {
      font-size: 13px;
      font-weight: 700;
      color: #AAAAC0;
    }

    .currency-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2D2D44;
      padding: 8px 16px;
      border-radius: 40px;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.5), 0 4px 0 #0B0B16;
    }

    .currency-box i {
      color: #FFD700;
      font-size: 20px;
    }

    .currency-count {
      font-weight: 800;
      font-size: 20px;
      color: #FFE484;
    }

    /* MASCOTE */
    .mascot-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(145deg, #23233B, #19192E);
      border-radius: 30px;
      padding: 10px 18px 10px 12px;
      margin-bottom: 20px;
      border: 1px solid #30304A;
      box-shadow: 0 8px 0 #0E0E1A;
    }

    .mascot-avatar {
      width: 70px;
      height: 70px;
      background: #4F7DF3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 0 0 4px #2D2D44, 0 8px 0 #15152B;
      transition: transform 0.15s;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .mascot-bubble {
      background: #2D2D44;
      border-radius: 24px 24px 24px 8px;
      padding: 12px 18px;
      max-width: 240px;
      font-weight: 700;
      font-size: 15px;
      line-height: 1.3;
      color: #EBEBFF;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.4), 0 4px 0 #0B0B16;
      border-left: 4px solid #4F7DF3;
    }

    /* TRILHA (SKILL TREE) */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .section-title h2 {
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #B6B6E0;
    }

    .section-title span {
      font-size: 13px;
      font-weight: 700;
      color: #6F6F9C;
    }

    .skill-tree {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .module {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #23233B;
      border-radius: 28px;
      padding: 8px 16px 8px 10px;
      box-shadow: 0 5px 0 #0E0E1A, inset 0 1px 2px rgba(255,255,255,0.05);
      border: 1px solid #35355A;
      transition: all 0.1s;
      cursor: pointer;
    }

    .module:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0E0E1A;
    }

    .module-icon {
      width: 52px;
      height: 52px;
      background: #2D2D50;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 0 #0E0E1A;
      color: #B6B6FF;
    }

    .module-info {
      flex: 1;
    }

    .module-name {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 2px;
      color: #FFFFFF;
    }

    .module-progress {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-bar-bg {
      flex: 1;
      height: 10px;
      background: #13132A;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px #00000080;
    }

    .progress-fill {
      height: 100%;
      width: 65%;
      background: linear-gradient(90deg, #4F7DF3, #9B6BFF);
      border-radius: 12px;
      box-shadow: 0 0 8px #4F7DF3;
    }

    .module-lock {
      font-size: 18px;
      color: #66668A;
    }

    .module.locked {
      opacity: 0.65;
      filter: grayscale(0.5);
    }

    .module.locked .module-icon {
      background: #1F1F36;
    }

    /* BOSS FIGHT - destaque */
    .module.boss {
      background: linear-gradient(145deg, #2A1E3A, #1D1530);
      border: 1px solid #9B6BFF;
      box-shadow: 0 5px 0 #160F2A, 0 0 15px rgba(155,107,255,0.3);
    }

    .module.boss .module-icon {
      background: #9B6BFF;
      color: #FFFFFF;
      text-shadow: 0 0 10px white;
    }

    /* AÇÕES RÁPIDAS */
    .quick-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .quick-btn {
      flex: 1;
      background: #2D2D50;
      border: none;
      border-radius: 30px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #EBEBFF;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 6px 0 #0E0E1A, inset 0 1px 2px rgba(255,255,255,0.1);
      border: 1px solid #3E3E68;
      transition: all 0.1s;
      cursor: pointer;
    }

    .quick-btn i {
      font-size: 24px;
      color: #B6B6FF;
    }

    .quick-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0E0E1A;
    }

    .quick-btn.highlight {
      background: #4F7DF3;
      border-color: #8AA9FF;
      color: white;
    }

    .quick-btn.highlight i {
      color: white;
    }

    /* LIGA / XP */
    .league-card {
      background: #23233B;
      border-radius: 30px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 0 #0E0E1A, inset 0 1px 2px rgba(255,255,255,0.05);
      border: 1px solid #3A3A5E;
      margin-bottom: 18px;
    }

    .league-info {
      display: flex;
      flex-direction: column;
    }

    .league-name {
      font-size: 18px;
      font-weight: 900;
      color: #CD7F32;
      text-shadow: 0 0 10px #CD7F32;
      letter-spacing: 0.5px;
    }

    .xp-bar-bg {
      width: 130px;
      height: 12px;
      background: #0F0F1F;
      border-radius: 20px;
      margin-top: 5px;
      overflow: hidden;
      box-shadow: inset 0 2px 5px black;
    }

    .xp-fill {
      height: 100%;
      width: 42%;
      background: linear-gradient(90deg, #FFB800, #FFD966);
      border-radius: 20px;
      box-shadow: 0 0 12px #FFB800;
    }

    .league-icon {
      font-size: 32px;
      background: #2D2D50;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #0E0E1A;
    }

    /* BOTÃO PRINCIPAL */
    .start-btn {
      background: #4F7DF3;
      border: none;
      width: 100%;
      padding: 18px;
      border-radius: 40px;
      font-weight: 900;
      font-size: 20px;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 8px 0 #1F3D8A, 0 10px 20px rgba(79,125,243,0.4);
      transition: all 0.1s;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid #8AA9FF;
    }

    .start-btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #1F3D8A;
    }

    .start-btn i {
      font-size: 24px;
    }

    /* modal de bloqueio de ofensiva (simulado) */
    .streak-freeze {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #9F9FD0;
      align-items: center;
    }

    .streak-freeze i {
      color: #6EC8FF;
    }

    .streak-freeze span {
      background: #2D2D50;
      padding: 4px 12px;
      border-radius: 20px;
      box-shadow: inset 0 1px 3px black;
      border: 1px solid #4A4A7A;
    }

    /* micro animações */
    .pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* rodapé com som */
    .sound-hint {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: #5A5A8A;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .sound-hint i {
      margin: 0 3px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- CABEÇALHO: OFENSIVA + MOEDAS -->
    <div class="header">
      <div class="streak-box">
        <i class="fas fa-fire"></i>
        <span class="streak-count" id="streakCount">12</span>
        <span class="streak-label">dias</span>
      </div>
      <div class="currency-box">
        <i class="fas fa-coins"></i>
        <span class="currency-count" id="coinCount">320</span>
      </div>
    </div>

    <!-- MASCOTE INTERATIVO -->
    <div class="mascot-area">
      <div class="mascot-avatar" id="mascotEmoji">💪</div>
      <div class="mascot-bubble" id="mascotMessage">
        Vamos treinar? Sua ofensiva está em jogo! 🔥
      </div>
    </div>

    <!-- TRILHA DE TREINO (SKILL TREE) -->
    <div class="section-title">
      <h2><i class="fas fa-map-signs" style="margin-right: 6px; color: #6B8CFF;"></i> Trilha</h2>
      <span>3 módulos</span>
    </div>

    <div class="skill-tree">
      <!-- MÓDULO 1: DESBLOQUEADO -->
      <div class="module" id="module1">
        <div class="module-icon">🏋️</div>
        <div class="module-info">
          <div class="module-name">Fundamentos da Força</div>
          <div class="module-progress">
            <div class="progress-bar-bg">
              <div class="progress-fill" style="width: 100%;"></div>
            </div>
            <i class="fas fa-check-circle" style="color: #4F7DF3; font-size: 18px;"></i>
          </div>
        </div>
        <div class="module-lock"></div>
      </div>

      <!-- MÓDULO 2: DESBLOQUEADO (EM PROGRESSO) -->
      <div class="module" id="module2">
        <div class="module-icon">🧘</div>
        <div class="module-info">
          <div class="module-name">Controle Core</div>
          <div class="module-progress">
            <div class="progress-bar-bg">
              <div class="progress-fill" style="width: 45%;"></div>
            </div>
            <span style="font-size: 13px; font-weight: 800; color: #B6B6FF;">45%</span>
          </div>
        </div>
        <div class="module-lock"></div>
      </div>

      <!-- MÓDULO 3: BOSS FIGHT (BLOQUEADO) -->
      <div class="module boss locked" id="module3">
        <div class="module-icon">👑</div>
        <div class="module-info">
          <div class="module-name">Domínio de Flexões</div>
          <div class="module-progress">
            <div class="progress-bar-bg">
              <div class="progress-fill" style="width: 0%;"></div>
            </div>
            <i class="fas fa-lock" style="color: #9B6BFF; font-size: 18px;"></i>
          </div>
        </div>
        <div class="module-lock">🔒</div>
      </div>
    </div>

    <!-- MICRO-SESSÕES / TREINO RÁPIDO -->
    <div class="quick-actions">
      <button class="quick-btn" id="quickWorkoutBtn">
        <i class="fas fa-bolt"></i>
        Treino Rápido
        <span style="font-size: 11px; font-weight: 600; color: #B6B6FF;">3-5 min</span>
      </button>
      <button class="quick-btn highlight" id="dailyWorkoutBtn">
        <i class="fas fa-dumbbell"></i>
        Treino Diário
        <span style="font-size: 11px; font-weight: 600; color: #D9E2FF;">+30 XP</span>
      </button>
    </div>

    <!-- LIGA / XP -->
    <div class="league-card">
      <div class="league-info">
        <div class="league-name">LIGA BRONZE</div>
        <div class="xp-bar-bg">
          <div class="xp-fill" style="width: 42%;"></div>
        </div>
        <div style="font-size: 12px; color: #9F9FD0; margin-top: 4px; font-weight: 700;">420 / 1000 XP</div>
      </div>
      <div class="league-icon">
        <i class="fas fa-medal" style="color: #CD7F32; font-size: 34px;"></i>
      </div>
    </div>

    <!-- BOTÃO PRINCIPAL (COMEÇAR TREINO) -->
    <button class="start-btn" id="mainStartBtn">
      <i class="fas fa-play-circle"></i> COMEÇAR TREINO
    </button>

    <!-- BLOQUEIO DE OFENSIVA (opção com moedas) -->
    <div class="streak-freeze">
      <i class="fas fa-snowflake"></i>
      <span id="freezeStreakBtn">Bloquear ofensiva · 50 moedas</span>
    </div>

    <!-- DICA DE SOM / FEEDBACK -->
    <div class="sound-hint">
      <i class="fas fa-volume-up"></i> Efeitos sonoros a cada repetição <i class="fas fa-music"></i>
    </div>
  </div>

  <script>
    (function() {
      // ----- ESTADO SIMULADO -----
      let coins = 320;
      let streak = 12;
      let xp = 420;
      const xpMax = 1000;

      // Elementos DOM
      const coinEl = document.getElementById('coinCount');
      const streakEl = document.getElementById('streakCount');
      const mascotEmoji = document.getElementById('mascotEmoji');
      const mascotMessage = document.getElementById('mascotMessage');
      const quickWorkoutBtn = document.getElementById('quickWorkoutBtn');
      const dailyWorkoutBtn = document.getElementById('dailyWorkoutBtn');
      const mainStartBtn = document.getElementById('mainStartBtn');
      const freezeStreakBtn = document.getElementById('freezeStreakBtn');
      const module2 = document.getElementById('module2');
      const module3 = document.getElementById('module3');
      
      // Atualiza elementos visuais
      function updateUI() {
        coinEl.textContent = coins;
        streakEl.textContent = streak;
        // Atualiza XP bar (simples, mas mantém a largura relativa)
        const xpFill = document.querySelector('.xp-fill');
        if (xpFill) {
          const percent = Math.min(100, (xp / xpMax) * 100);
          xpFill.style.width = percent + '%';
        }
        // Atualiza mensagem do mascote dependendo do streak
        if (streak > 0) {
          mascotMessage.textContent = `Sequência de ${streak} dias! Não quebre agora! 🔥`;
        } else {
          mascotMessage.textContent = `Vamos começar uma nova ofensiva? 💪`;
        }
      }

      // Efeito sonoro simulado (Web Audio API)
      function playSound(type = 'success') {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          
          if (type === 'success') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.4);
          } else if (type === 'coin') {
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(987.77, audioCtx.currentTime); // B5
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
          } else if (type === 'streak') {
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(349.23, audioCtx.currentTime); // F4
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime + 0.12);
            gainNode.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
          }
        } catch (e) {
          // fallback silencioso
        }
      }

      // Animação no mascote (feedback visual)
      function mascotReact(action) {
        if (action === 'celebrate') {
          mascotEmoji.textContent = '🎉';
          mascotEmoji.style.transform = 'scale(1.2)';
          setTimeout(() => {
            mascotEmoji.style.transform = 'scale(1)';
            mascotEmoji.textContent = '💪';
          }, 600);
        } else if (action === 'coin') {
          mascotEmoji.textContent = '🤑';
          setTimeout(() => mascotEmoji.textContent = '💪', 500);
        } else if (action === 'streak') {
          mascotEmoji.textContent = '🔥';
          setTimeout(() => mascotEmoji.textContent = '💪', 700);
        } else if (action === 'lock') {
          mascotEmoji.textContent = '🔒';
          setTimeout(() => mascotEmoji.textContent = '💪', 600);
        }
      }

      // Função para completar treino (simula ganho de XP, moedas e progresso)
      function completeWorkout(source = 'main') {
        // Ganho base
        let xpGain = 30;
        let coinGain = 15;
        let msg = '';

        if (source === 'quick') {
          xpGain = 10;
          coinGain = 5;
          msg = 'Treino rápido concluído! +10 XP e +5 moedas';
        } else if (source === 'daily') {
          xpGain = 35;
          coinGain = 20;
          msg = 'Treino diário! +35 XP e +20 moedas 🔥';
        } else {
          msg = 'Treino concluído! +30 XP e +15 moedas';
        }

        // Atualiza XP (com overflow simples)
        xp += xpGain;
        if (xp >= xpMax) {
          xp = xp - xpMax;
          // Poderia subir de liga, mas apenas feedback
          mascotMessage.textContent = '🏆 Parabéns! Você avançou de liga!';
        }

        // Moedas
        coins += coinGain;
        // Ofensiva: se treinou, aumenta streak (máximo 1 vez por dia simulado, mas aqui só incrementa)
        streak += 1;

        // Feedback sonoro
        playSound('success');
        setTimeout(() => playSound('coin'), 150);
        setTimeout(() => playSound('streak'), 300);

        // Reação do mascote
        mascotReact('celebrate');
        setTimeout(() => mascotReact('coin'), 400);
        setTimeout(() => mascotReact('streak'), 800);

        // Atualiza UI
        updateUI();

        // Mensagem personalizada
        mascotMessage.textContent = msg;

        // Efeito extra: atualizar barra de progresso do módulo 2 (apenas cosmético)
        if (module2) {
          const progressFill = module2.querySelector('.progress-fill');
          let currentWidth = parseFloat(progressFill.style.width) || 45;
          let newWidth = Math.min(100, currentWidth + 5);
          progressFill.style.width = newWidth + '%';
          const progressSpan = module2.querySelector('.module-progress span');
          if (progressSpan) progressSpan.textContent = Math.floor(newWidth) + '%';
          
          // Se chegar a 100%, desbloquear módulo 3 (boss)
          if (newWidth >= 100) {
            module3.classList.remove('locked');
            module3.querySelector('.module-lock').innerHTML = ''; // remove cadeado
            module3.querySelector('.fa-lock')?.classList.remove('fa-lock');
            // adiciona ícone de espada ou algo
            const lockIcon = module3.querySelector('.module-progress i');
            if (lockIcon) {
              lockIcon.className = 'fas fa-bolt';
              lockIcon.style.color = '#FFD966';
            }
            mascotMessage.textContent = '👑 DESAFIO CHEFE DESBLOQUEADO! Prepare-se!';
            playSound('streak');
          }
        }
      }

      // Event listeners
      quickWorkoutBtn.addEventListener('click', () => {
        completeWorkout('quick');
        // vibração fake
        if (navigator.vibrate) navigator.vibrate(30);
      });

      dailyWorkoutBtn.addEventListener('click', () => {
        completeWorkout('daily');
        if (navigator.vibrate) navigator.vibrate(50);
      });

      mainStartBtn.addEventListener('click', () => {
        // Simula treino completo
        completeWorkout('main');
        if (navigator.vibrate) navigator.vibrate(80);
      });

      // Bloqueio de ofensiva (gasta moedas)
      freezeStreakBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (coins >= 50) {
          coins -= 50;
          // Impede perda de streak (simulação)
          updateUI();
          mascotMessage.textContent = '❄️ Ofensiva bloqueada por 24h! Use com sabedoria.';
          mascotReact('lock');
          playSound('coin');
          // Animação de moeda saindo
          const coinBox = document.querySelector('.currency-box');
          coinBox.style.transform = 'scale(1.1)';
          setTimeout(() => coinBox.style.transform = 'scale(1)', 200);
          if (navigator.vibrate) navigator.vibrate(20);
        } else {
          mascotMessage.textContent = 'Moedas insuficientes! Treine mais para ganhar. 😅';
          mascotReact('lock');
          playSound('lock');
        }
      });

      // Simular clique nos módulos (feedback)
      document.querySelectorAll('.module').forEach(mod => {
        mod.addEventListener('click', (e) => {
          if (mod.classList.contains('locked')) {
            mascotMessage.textContent = 'Módulo bloqueado! Complete o anterior ou vença o chefe. 🔒';
            mascotReact('lock');
            playSound('lock');
          } else {
            mascotMessage.textContent = 'Bom treino! Foco na forma correta. 🎯';
            playSound('success');
          }
        });
      });

      // Inicializa UI
      updateUI();

      // Pequeno easter egg: clique no mascote
      mascotEmoji.addEventListener('click', () => {
        mascotMessage.textContent = 'Ei, não me aperte! Vamos treinar! 😄';
        mascotReact('celebrate');
        playSound('coin');
      });

      // Ajuste para mobile: evitar double tap zoom
      document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('touchstart', (e) => {
          // nada, só previne
        }, { passive: true });
      });

      // Atualiza a barra de XP inicial
      const xpFillInit = document.querySelector('.xp-fill');
      if (xpFillInit) xpFillInit.style.width = '42%';
    })();
  </script>
</body>
</html>
