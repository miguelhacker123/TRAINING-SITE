<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALISTHENIX - Treino de Peso Corporal</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #16161a;
            --accent-green: #2cb67d;
            --accent-orange: #ff6e40;
            --accent-purple: #7f5af0;
            --text-color: #fffffe;
            --text-dim: #94a1b2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid #242629;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-green);
            text-transform: uppercase;
        }

        .streak-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 110, 64, 0.15);
            color: var(--accent-orange);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            border: 1px solid var(--accent-orange);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #242629;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 1.3rem;
            color: var(--accent-green);
        }

        /* Formulario de Perfil */
        .user-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .input-group input {
            background: #010101;
            border: 1px solid #242629;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-green);
        }

        button.btn {
            background: var(--accent-green);
            color: #010101;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        button.btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .stats-results {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #242629;
        }

        .stat-item {
            background: #010101;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-item span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .stat-item strong {
            font-size: 1.2rem;
            color: var(--accent-purple);
        }

        /* Modos de Treino */
        .level-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .level-btn {
            background: #010101;
            border: 1px solid #242629;
            color: var(--text-dim);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .level-btn.active {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }

        /* Lista de Exercicios */
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exercise-card {
            background: #010101;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent-green);
        }

        .exercise-info h3 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .exercise-info p {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .btn-complete {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: var(--accent-orange);
            color: #fff;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .user-form {
                grid-template-columns: 1fr;
            }
            .level-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Calisthenix</div>
        <div class="streak-badge">
            🔥 <span id="streak-count">0</span> Dias
        </div>
    </header>

    <div class="container">
        <!-- Card do Perfil / Calculadora -->
        <div class="card">
            <h2>Seu Perfil de Atleta</h2>
            <div class="user-form">
                <div class="input-group">
                    <label for="height">Altura (cm)</label>
                    <input type="number" id="height" placeholder="Ex: 175">
                </div>
                <div class="input-group">
                    <label for="weight">Peso (kg)</label>
                    <input type="number" id="weight" placeholder="Ex: 70">
                </div>
                <button class="btn" onclick="calculateMetrics()">Calcular</button>
            </div>

            <div class="stats-results" id="stats" style="display: none;">
                <div class="stat-item">
                    <span>IMC</span>
                    <strong id="bmi-val">-</strong>
                </div>
                <div class="stat-item">
                    <span>Meta Calórica Diária</span>
                    <strong id="calories-val">- kcal</strong>
                </div>
            </div>
        </div>

        <!-- Card dos Treinos -->
        <div class="card">
            <h2>Escolha seu Nível</h2>
            <div class="level-selector">
                <button class="level-btn active" onclick="setLevel('iniciante')">Iniciante</button>
                <button class="level-btn" onclick="setLevel('intermediario')">Intermediário</button>
                <button class="level-btn" onclick="setLevel('avancado')">Avançado</button>
            </div>

            <div class="exercise-list" id="exercise-container">
                <!-- Exercicios inseridos via JS -->
            </div>

            <button class="btn btn-complete" onclick="completeWorkout()">CONCLUIR TREINO DE HOJE 🚀</button>
        </div>
    </div>

    <script>
        // Dados dos Treinos de Calistenia
        const workouts = {
            iniciante: [
                { name: "Flexão de Braço Com Joelhos", sets: "3 Séries", reps: "8-12 repetições" },
                { name: "Agachamento Livre", sets: "3 Séries", reps: "15 repetições" },
                { name: "Remada Invertida na Mesa/Barra", sets: "3 Séries", reps: "8 repetições" },
                { name: "Prancha Frontal", sets: "3 Séries", reps: "30 segundos" }
            ],
            intermediario: [
                { name: "Flexão de Braço Tradicional", sets: "4 Séries", reps: "12-15 repetições" },
                { name: "Barra Fixa (Pull-ups)", sets: "4 Séries", reps: "6-8 repetições" },
                { name: "Afundo (Lunge)", sets: "3 Séries", reps: "12 cada perna" },
                { name: "Dips em Paralelas/Cadeira", sets: "3 Séries", reps: "10 repetições" },
                { name: "L-Sit no Chão", sets: "3 Séries", reps: "15 segundos" }
            ],
            avancado: [
                { name: "Flexão Diamante / Pique (Pike Pushup)", sets: "4 Séries", reps: "12 repetições" },
                { name: "Barra Fixa Peq. Pronada / Supinada", sets: "4 Séries", reps: "10-12 repetições" },
                { name: "Agachamento Pistola (Pistol Squat)", sets: "3 Séries", reps: "6-8 cada perna" },
                { name: "Muscle-up ou Dips Avançado", sets: "4 Séries", reps: "5-8 repetições" },
                { name: "Dragon Flag / Abdominal Canivete", sets: "3 Séries", reps: "10 repetições" }
            ]
        };

        let currentLevel = 'iniciante';

        // Carregar dados salvos ao iniciar a página
        window.onload = () => {
            loadUserData();
            renderWorkout();
            checkStreak();
        };

        // Renderizar Exercícios na tela
        function renderWorkout() {
            const container = document.getElementById('exercise-container');
            container.innerHTML = '';

            workouts[currentLevel].forEach(ex => {
                const item = document.createElement('div');
                item.className = 'exercise-card';
                item.innerHTML = `
                    <div class="exercise-info">
                        <h3>${ex.name}</h3>
                        <p>${ex.sets}</p>
                    </div>
                    <span style="color: var(--accent-orange); font-weight: bold;">${ex.reps}</span>
                `;
                container.appendChild(item);
            });
        }

        // Alterar o Nível do Treino
        function setLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase() === level) {
                    btn.classList.add('active');
                }
            });
            renderWorkout();
        }

        // Calcular IMC e Calorias
        function calculateMetrics() {
            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);

            if (!height || !weight) {
                alert("Por favor, preencha altura e peso corretamente!");
                return;
            }

            // Calculo IMC
            const heightInMeters = height / 100;
            const bmi = (weight / (heightInMeters * heightInMeters)).toFixed(1);

            // Estimativa Basal simples + Calistenia
            const estimatedCalories = Math.round((10 * weight) + (6.25 * height) - (5 * 25) + 5 + 400);

            document.getElementById('bmi-val').innerText = bmi;
            document.getElementById('calories-val').innerText = `${estimatedCalories} kcal`;
            document.getElementById('stats').style.display = 'grid';

            // Salvar no navegador
            localStorage.setItem('user_height', height);
            localStorage.setItem('user_weight', weight);
        }

        // Carregar dados salvos
        function loadUserData() {
            const h = localStorage.getItem('user_height');
            const w = localStorage.getItem('user_weight');
            if (h && w) {
                document.getElementById('height').value = h;
                document.getElementById('weight').value = w;
                calculateMetrics();
            }
        }

        // Sistema de Streaks (Ofensiva estilo Duolingo)
        function checkStreak() {
            const streak = parseInt(localStorage.getItem('streak_count')) || 0;
            document.getElementById('streak-count').innerText = streak;
        }

        function completeWorkout() {
            const lastDate = localStorage.getItem('last_workout_date');
            const today = new Date().toDateString();

            if (lastDate === today) {
                alert("Você já completou o treino de hoje! Volte amanhã para manter a ofensiva 🔥");
                return;
            }

            let streak = parseInt(localStorage.getItem('streak_count')) || 0;
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);

            if (lastDate === yesterday.toDateString()) {
                streak += 1;
            } else if (lastDate !== today) {
                // Se faltou algum dia, reinicia ou começa com 1
                streak = 1;
            }

            localStorage.setItem('streak_count', streak);
            localStorage.setItem('last_workout_date', today);

            document.getElementById('streak-count').innerText = streak;
            alert(`PARABÉNS! Treino Concluído! 🔥 Ofensiva atual: ${streak} dias!`);
        }
    </script>
</body>
</html>
